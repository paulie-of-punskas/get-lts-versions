name: "Get Long Term Support versions for programming language"
description: "Action returns an array of N latest long term support versions"
inputs:
  language:
    description: Name of the programming language
    required: true
    default: "go"
  versions_to_fetch:
    description: How many long term support versions to fetch and return
    required: false
    default: "3"
  print_eol_information:
    description: Should additional function about end of life be printed to user
    required: false
    default: "false"
outputs:
  lts_versions:
    description: Array holding returned LTS versions
    value: ${{ steps.get-lts-versions.outputs.lts_versions }}

runs:
  using: "composite"
  steps:
    - id: get-lts-versions
      run: echo "lts_versions=$(./get-lts-versions -language=${{ inputs.language }} -versions=${{ inputs.versions_to_fetch }} -check_eol=${{ inputs.print_eol_information }})" >> $GITHUB_OUTPUT
      shell: bash