name: Pre-release checks
description: Works only if SemVer convention is followed

on:
  workflow_dispatch:
  pull_request:
    types: ["opened"]

jobs:
  check:
    name: Run pre-release checks
    runs-on: ubuntu-latest
    env:
      node-version: 24

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Compare current version with latest one available on GitHub
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            // extract version from package.json
            import packageJsonFile from './package.json';
            const packageJson = JSON.parse(JSON.stringify(packageJsonFile));

            const versionOnGitHub = await (async () => {
                try {
                    const response = await fetch("https://api.github.com/repos/paulie-of-punskas/get-lts-versions/releases/latest", {
                        headers: {
                            "Accept": "application/vnd.github+json",
                            "X-GitHub-Api-Version": "2026-03-10",
                        }
                    });

                    if (!response.ok) {
                        throw new Error(`GitHub API error occurred: ${response.status}`);
                    }

                    const data = await response.json();
                    return data.tag_name;
                } catch (error) {
                    console.error(`Failed to fetch version from GitHub: ${error}`);
                    return "";
                }
            })();

            function isSemVerUpdated(packageVersion: string, versionOnGitHub: string): boolean {
                // remove 'v' from the start of the string
                const packageVersionsanitized = packageVersion.replace("v", "").split(".");
                const versionOnGitHubSanitized = versionOnGitHub.replace("v", "").split(".");

                const versionsMaxLength = Math.max(packageVersionsanitized.length, versionOnGitHubSanitized.length);
                [packageVersionsanitized, versionOnGitHubSanitized].forEach((element) => {
                    if (element.length < versionsMaxLength) {
                        element.push("0");
                    }
                });

                for (let j = 0; j < versionsMaxLength; j++) {
                    const number1 = Number(packageVersionsanitized[j]);
                    const number2 = Number(versionOnGitHubSanitized[j]);

                    if (number1 > number2) {
                        return false;
                    }
                    if (number1 < number2) {
                        return true;
                    }
                }
                // in case all are equal
                return false;
            }

            console.log(isSemVerUpdated(packageJson.version, versionOnGitHub));
