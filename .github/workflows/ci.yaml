name: CI
description: CI job for Golang/Go

on:
  push:
    paths:
      - '*.go'
      - 'go.mod'
      - '.github/workflows/ci.yaml'

jobs:
  setup-environment-test-and-build:
    name: CI - Go ${{ matrix.go-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # os: [ ubuntu-latest, macos-latest, windows-latest ]
        os: [ ubuntu-latest ]
        go-version: [ 1.24.2 ]

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Go ${{ matrix.go-version }} environment
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '${{ matrix.go-version }}'
          cache: true
          architecture: 'x64'

      - name: Run tests
        shell: bash
        run: |
          go test . -v

      # - name: Build
      #   shell: bash
      #   run: |
      #     # if windows, then build exe?
      #     go build .