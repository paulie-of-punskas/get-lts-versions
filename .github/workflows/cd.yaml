name: CD
description: Run pre-release checks. Compare declared version with latest one on GitHub. Works only if SemVer convention is followed.

on:
  pull_request:
    branches: [ "main" ]
    types: [ "opened", "synchronize" ]

permissions:
    contents: write

jobs:
  check:
    name: Run pre-release checks
    runs-on: ubuntu-latest
    env:
      go-version: 1.24.2

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Setup Go ${{ env.go-version }} environment
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '${{ env.go-version }}'
          cache: true
          architecture: 'x64'

      - name: Build the binary, extract version of the app
        id: build-version
        shell: bash
        run: |
            go build .
            echo "app_version=$(./get-lts-versions -print_version)" >> "$GITHUB_OUTPUT"

      - name: Compare current version with latest one available on GitHub
        id: check-version
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          APP_VERSION: ${{ steps.build-version.outputs.app_version }}
        with:
          script: |
            const appVersion = process.env.APP_VERSION;
            const versionOnGitHub = await (async () => {
                try {
                    const response = await fetch("https://api.github.com/repos/paulie-of-punskas/get-lts-versions/releases/latest", {
                        headers: {
                            "Accept": "application/vnd.github+json",
                            "X-GitHub-Api-Version": "2026-03-10",
                        }
                    });

                    if (!response.ok) {
                        throw new Error(`GitHub API error occurred: ${response.status}`);
                    }

                    const data = await response.json();
                    return data.tag_name;
                } catch (error) {
                    core.setFailed(`Failed to fetch version from GitHub: ${error}`);
                    return "";
                }
            })();

            function isSemVerUpdated(packageVersion, versionOnGitHub) {
                // remove 'v' from the start of the string
                const packageVersionSanitized = packageVersion.replace("v", "").split(".");
                const versionOnGitHubSanitized = versionOnGitHub.replace("v", "").split(".");

                const versionsMaxLength = Math.max(packageVersionSanitized.length, versionOnGitHubSanitized.length);
                [packageVersionSanitized, versionOnGitHubSanitized].forEach((element) => {
                    if (element.length < versionsMaxLength) {
                        element.push("0");
                    }
                });

                for (let j = 0; j < versionsMaxLength; j++) {
                    const number1 = Number(packageVersionSanitized[j]);
                    const number2 = Number(versionOnGitHubSanitized[j]);

                    if (number1 > number2) {
                        return true;
                    }
                    if (number1 < number2) {
                        return false;
                    }
                }
                // in case all are equal
                return false;
            }

            const isVersionUpdated = isSemVerUpdated(appVersion, versionOnGitHub);
            if (!isVersionUpdated) {
                core.setFailed(`Package version (${appVersion}) needs to be higher than latest release (${versionOnGitHub.replace("v", "")}) on GitHub`);
                core.setOutput('versionOK', 'false')
            } else {
                core.setOutput('versionOK', 'true')
            }

      - name: Commit compiled binary to the branch
        if: ${{ steps.check-version.outputs.versionOK == 'true' }}
        shell: bash
        run: |
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git remote set-url origin https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}
            git add ./get-lts-versions
            git commit -m "Compile and add binary"
            # git push HEAD:$(git branch --show-current)
            git push origin ${{ github.event.pull_request.head.ref }}