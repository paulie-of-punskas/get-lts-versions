name: Test - get LTS versions

on:
  push:
    paths:
      - 'src/**'
      - 'test/**'
      - '.github/workflows/test-action.yaml'
  schedule:
    - cron: "0 8 * * 1"

jobs:
  get-lts-versions:
    name: Fetch LTS versions
    runs-on: ubuntu-latest
    env:
      node-version: 1.24.2

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Go ${{ env.node-version }} environment
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '${{ env.node-version }}'
          cache: true
          architecture: 'x64'

      - name: Build
        run: go build .

